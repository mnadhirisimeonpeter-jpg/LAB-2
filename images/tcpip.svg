<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="260" fill="#f0f4ff" rx="10"/>
  <!-- Layers -->
  <rect x="60" y="30" width="260" height="45" rx="6" fill="#1565c0"/>
  <text x="190" y="57" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Application Layer</text>
  <text x="190" y="72" text-anchor="middle" fill="#cce0ff" font-size="10">HTTP, FTP, SMTP, DNS</text>
  <rect x="60" y="85" width="260" height="45" rx="6" fill="#0a4f8c"/>
  <text x="190" y="112" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Transport Layer (TCP)</text>
  <text x="190" y="127" text-anchor="middle" fill="#cce0ff" font-size="10">Reliable delivery, ordering, error-checking</text>
  <rect x="60" y="140" width="260" height="45" rx="6" fill="#1976d2"/>
  <text x="190" y="167" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Internet Layer (IP)</text>
  <text x="190" y="182" text-anchor="middle" fill="#cce0ff" font-size="10">Addressing and routing packets</text>
  <rect x="60" y="195" width="260" height="45" rx="6" fill="#42a5f5"/>
  <text x="190" y="222" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Network Access Layer</text>
  <text x="190" y="237" text-anchor="middle" fill="#e3f2fd" font-size="10">Ethernet, Wi-Fi, physical hardware</text>
  <!-- Arrows -->
  <line x1="320" y1="130" x2="380" y2="130" stroke="#0a2342" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0a2342"/></marker></defs>
  <!-- IP Address box -->
  <rect x="390" y="60" width="250" height="160" rx="8" fill="white" stroke="#1565c0" stroke-width="1.5"/>
  <text x="515" y="85" text-anchor="middle" fill="#1565c0" font-size="13" font-weight="bold">IP Address Example</text>
  <text x="515" y="108" text-anchor="middle" fill="#0a2342" font-size="12">IPv4: 216.27.61.137</text>
  <rect x="410" y="115" width="210" height="30" rx="4" fill="#e8f0fe"/>
  <text x="435" y="132" fill="#1565c0" font-size="11">216</text>
  <line x1="465" y1="120" x2="465" y2="145" stroke="#aaa" stroke-width="1"/>
  <text x="480" y="132" fill="#1565c0" font-size="11">27</text>
  <line x1="505" y1="120" x2="505" y2="145" stroke="#aaa" stroke-width="1"/>
  <text x="520" y="132" fill="#1565c0" font-size="11">61</text>
  <line x1="545" y1="120" x2="545" y2="145" stroke="#aaa" stroke-width="1"/>
  <text x="555" y="132" fill="#1565c0" font-size="11">137</text>
  <text x="515" y="165" text-anchor="middle" fill="#546e7a" font-size="10">4 octets × 8 bits = 32 bits</text>
  <text x="515" y="185" text-anchor="middle" fill="#0a2342" font-size="11">IPv6: 128-bit hexadecimal</text>
  <text x="515" y="205" text-anchor="middle" fill="#546e7a" font-size="9">2001:0db8:85a3::8a2e:0370:7334</text>
  <text x="350" y="252" text-anchor="middle" fill="#0a2342" font-size="12" font-weight="bold">TCP/IP — The Internet's Communication Suite</text>
</svg>

<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="280" fill="#f0f4ff" rx="10"/>
  <!-- Globe -->
  <circle cx="350" cy="140" r="100" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <ellipse cx="350" cy="140" rx="50" ry="100" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <ellipse cx="350" cy="140" rx="100" ry="30" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <ellipse cx="350" cy="140" rx="100" ry="65" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Meridian lines -->
  <line x1="350" y1="40" x2="350" y2="240" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Nodes around globe -->
  <circle cx="120" cy="80" r="22" fill="#1565c0"/>
  <text x="120" y="85" text-anchor="middle" fill="white" font-size="11" font-weight="bold">User</text>
  <circle cx="580" cy="80" r="22" fill="#00897b"/>
  <text x="580" y="85" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Server</text>
  <circle cx="120" cy="200" r="22" fill="#00897b"/>
  <text x="120" y="205" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Server</text>
  <circle cx="580" cy="200" r="22" fill="#1565c0"/>
  <text x="580" y="205" text-anchor="middle" fill="white" font-size="11" font-weight="bold">User</text>
  <!-- Connection lines to globe -->
  <line x1="140" y1="88" x2="260" y2="120" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="558" y1="88" x2="440" y2="120" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="140" y1="192" x2="260" y2="160" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="558" y1="192" x2="440" y2="160" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Label -->
  <text x="350" y="260" text-anchor="middle" fill="#0a2342" font-size="13" font-weight="bold">World Wide Web — Global Hypermedia Network</text>
</svg>

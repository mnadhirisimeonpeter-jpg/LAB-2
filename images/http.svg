<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="220" fill="#f0f4ff" rx="10"/>
  <!-- Browser -->
  <rect x="30" y="50" width="160" height="130" rx="8" fill="white" stroke="#1565c0" stroke-width="2"/>
  <rect x="30" y="50" width="160" height="28" rx="8" fill="#1565c0"/>
  <rect x="30" y="65" width="160" height="13" fill="#1565c0"/>
  <text x="110" y="68" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Browser (Client)</text>
  <text x="110" y="100" text-anchor="middle" fill="#546e7a" font-size="10">User types URL</text>
  <rect x="45" y="108" width="130" height="18" rx="4" fill="#e3f2fd"/>
  <text x="110" y="121" text-anchor="middle" fill="#1565c0" font-size="9">Sends HTTP Request</text>
  <rect x="45" y="130" width="130" height="18" rx="4" fill="#e8f5e9"/>
  <text x="110" y="143" text-anchor="middle" fill="#2e7d32" font-size="9">Receives HTTP Response</text>
  <rect x="45" y="152" width="130" height="18" rx="4" fill="#f3e5f5"/>
  <text x="110" y="165" text-anchor="middle" fill="#6a1b9a" font-size="9">Renders HTML page</text>
  <!-- Arrows -->
  <line x1="192" y1="105" x2="310" y2="105" stroke="#ff9800" stroke-width="2"/>
  <polygon points="310,101 320,105 310,109" fill="#ff9800"/>
  <text x="256" y="97" text-anchor="middle" fill="#ff9800" font-size="9" font-weight="bold">GET /index.html HTTP/1.1</text>
  <text x="256" y="108" text-anchor="middle" fill="#ff9800" font-size="8">Host: www.strathmore.edu</text>
  <line x1="320" y1="140" x2="200" y2="140" stroke="#43a047" stroke-width="2"/>
  <polygon points="200,136 190,140 200,144" fill="#43a047"/>
  <text x="258" y="134" text-anchor="middle" fill="#43a047" font-size="9" font-weight="bold">HTTP/1.1 200 OK</text>
  <text x="258" y="149" text-anchor="middle" fill="#43a047" font-size="8">Content-Type: text/html</text>
  <!-- Server -->
  <rect x="320" y="50" width="160" height="130" rx="8" fill="white" stroke="#00897b" stroke-width="2"/>
  <rect x="320" y="50" width="160" height="28" rx="8" fill="#00897b"/>
  <rect x="320" y="65" width="160" height="13" fill="#00897b"/>
  <text x="400" y="68" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Web Server</text>
  <text x="400" y="100" text-anchor="middle" fill="#546e7a" font-size="10">Port 80 (HTTP)</text>
  <text x="400" y="116" text-anchor="middle" fill="#546e7a" font-size="10">Port 443 (HTTPS)</text>
  <text x="400" y="140" text-anchor="middle" fill="#00695c" font-size="9">Processes request</text>
  <text x="400" y="155" text-anchor="middle" fill="#00695c" font-size="9">Returns resource</text>
  <!-- HTTPS box -->
  <rect x="510" y="55" width="165" height="115" rx="8" fill="white" stroke="#546e7a" stroke-width="1.5"/>
  <text x="592" y="78" text-anchor="middle" fill="#0a2342" font-size="11" font-weight="bold">HTTP Methods</text>
  <text x="530" y="96" fill="#e53935" font-size="10" font-weight="bold">GET</text><text x="560" y="96" fill="#546e7a" font-size="9"> — retrieve resource</text>
  <text x="530" y="112" fill="#e65100" font-size="10" font-weight="bold">POST</text><text x="566" y="112" fill="#546e7a" font-size="9"> — send data</text>
  <text x="530" y="128" fill="#1565c0" font-size="10" font-weight="bold">PUT</text><text x="556" y="128" fill="#546e7a" font-size="9"> — update resource</text>
  <text x="530" y="144" fill="#f44336" font-size="10" font-weight="bold">DELETE</text><text x="590" y="144" fill="#546e7a" font-size="9"> — remove</text>
  <text x="530" y="160" fill="#7b1fa2" font-size="10" font-weight="bold">HEAD</text><text x="567" y="160" fill="#546e7a" font-size="9"> — headers only</text>
  <text x="350" y="205" text-anchor="middle" fill="#0a2342" font-size="12" font-weight="bold">HTTP — Hypertext Transfer Protocol Request-Response Cycle</text>
</svg>

<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="250" fill="#f0f4ff" rx="10"/>
  <!-- Browser window -->
  <rect x="40" y="30" width="230" height="180" rx="8" fill="white" stroke="#1565c0" stroke-width="2"/>
  <rect x="40" y="30" width="230" height="36" rx="8" fill="#1565c0"/>
  <rect x="40" y="50" width="230" height="16" fill="#1565c0"/>
  <circle cx="60" cy="48" r="6" fill="#ef5350"/>
  <circle cx="80" cy="48" r="6" fill="#ffa726"/>
  <circle cx="100" cy="48" r="6" fill="#66bb6a"/>
  <rect x="115" y="40" width="140" height="14" rx="7" fill="rgba(255,255,255,0.2)"/>
  <text x="185" y="51" text-anchor="middle" fill="white" font-size="8">https://www.strathmore.edu</text>
  <!-- Page content sketch -->
  <rect x="55" y="80" width="200" height="12" rx="3" fill="#e3f2fd"/>
  <rect x="55" y="100" width="160" height="8" rx="3" fill="#f5f5f5"/>
  <rect x="55" y="115" width="180" height="8" rx="3" fill="#f5f5f5"/>
  <rect x="55" y="130" width="140" height="8" rx="3" fill="#f5f5f5"/>
  <rect x="55" y="155" width="90" height="30" rx="4" fill="#bbdefb"/>
  <rect x="155" y="155" width="90" height="30" rx="4" fill="#c8e6c9"/>
  <text x="155" y="115" text-anchor="middle" fill="#1565c0" font-size="11" font-weight="bold">Web Browser</text>
  <!-- Arrow HTTP -->
  <line x1="275" y1="110" x2="380" y2="110" stroke="#ff9800" stroke-width="2"/>
  <polygon points="380,106 390,110 380,114" fill="#ff9800"/>
  <text x="332" y="104" text-anchor="middle" fill="#ff9800" font-size="10" font-weight="bold">HTTP Request</text>
  <line x1="390" y1="140" x2="285" y2="140" stroke="#43a047" stroke-width="2"/>
  <polygon points="285,136 275,140 285,144" fill="#43a047"/>
  <text x="337" y="134" text-anchor="middle" fill="#43a047" font-size="10" font-weight="bold">HTTP Response</text>
  <!-- Server -->
  <rect x="390" y="40" width="270" height="170" rx="8" fill="white" stroke="#00897b" stroke-width="2"/>
  <rect x="390" y="40" width="270" height="36" rx="8" fill="#00897b"/>
  <rect x="390" y="56" width="270" height="20" fill="#00897b"/>
  <text x="525" y="62" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Web Server</text>
  <!-- Server rack graphic -->
  <rect x="420" y="90" width="210" height="25" rx="4" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>
  <circle cx="440" cy="102" r="6" fill="#4caf50"/>
  <text x="530" y="107" text-anchor="middle" fill="#0a2342" font-size="10">HTML, CSS, Images</text>
  <rect x="420" y="122" width="210" height="25" rx="4" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>
  <circle cx="440" cy="134" r="6" fill="#4caf50"/>
  <text x="530" y="139" text-anchor="middle" fill="#0a2342" font-size="10">Application Files</text>
  <rect x="420" y="154" width="210" height="25" rx="4" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>
  <circle cx="440" cy="166" r="6" fill="#4caf50"/>
  <text x="530" y="171" text-anchor="middle" fill="#0a2342" font-size="10">Database Connections</text>
  <text x="350" y="230" text-anchor="middle" fill="#0a2342" font-size="12" font-weight="bold">Browser (Client) ↔ Web Server — The HTTP Cycle</text>
</svg>

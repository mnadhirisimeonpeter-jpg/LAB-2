<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="220" fill="#f0f4ff" rx="10"/>
  <!-- Client -->
  <rect x="30" y="60" width="160" height="110" rx="8" fill="white" stroke="#1565c0" stroke-width="2"/>
  <rect x="30" y="60" width="160" height="28" rx="8" fill="#1565c0"/>
  <rect x="30" y="74" width="160" height="14" fill="#1565c0"/>
  <text x="110" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">FTP Client</text>
  <text x="110" y="108" text-anchor="middle" fill="#546e7a" font-size="9">FileZilla / Command line</text>
  <rect x="45" y="115" width="130" height="18" rx="4" fill="#e3f2fd"/>
  <text x="110" y="128" text-anchor="middle" fill="#1565c0" font-size="9">📁 Local Files</text>
  <rect x="45" y="138" width="130" height="18" rx="4" fill="#e3f2fd"/>
  <text x="110" y="151" text-anchor="middle" fill="#1565c0" font-size="9">Login: user / password</text>
  <!-- Control channel arrow -->
  <line x1="192" y1="90" x2="318" y2="90" stroke="#9c27b0" stroke-width="1.5"/>
  <polygon points="318,86 328,90 318,94" fill="#9c27b0"/>
  <text x="255" y="82" text-anchor="middle" fill="#9c27b0" font-size="9" font-weight="bold">Control Connection (Port 21)</text>
  <text x="255" y="93" text-anchor="middle" fill="#9c27b0" font-size="8">Commands: USER, PASS, LIST, RETR, STOR</text>
  <!-- Data channel arrow -->
  <line x1="328" y1="140" x2="200" y2="140" stroke="#ff9800" stroke-width="2"/>
  <polygon points="200,136 190,140 200,144" fill="#ff9800"/>
  <line x1="192" y1="155" x2="320" y2="155" stroke="#43a047" stroke-width="2"/>
  <polygon points="320,151 330,155 320,159" fill="#43a047"/>
  <text x="260" y="133" text-anchor="middle" fill="#ff9800" font-size="9" font-weight="bold">⬇ DOWNLOAD (GET)</text>
  <text x="260" y="168" text-anchor="middle" fill="#43a047" font-size="9" font-weight="bold">⬆ UPLOAD (PUT)</text>
  <text x="260" y="120" text-anchor="middle" fill="#546e7a" font-size="8">Data Connection (Port 20)</text>
  <!-- Server -->
  <rect x="328" y="60" width="160" height="110" rx="8" fill="white" stroke="#00897b" stroke-width="2"/>
  <rect x="328" y="60" width="160" height="28" rx="8" fill="#00897b"/>
  <rect x="328" y="74" width="160" height="14" fill="#00897b"/>
  <text x="408" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">FTP Server</text>
  <text x="408" y="108" text-anchor="middle" fill="#546e7a" font-size="9">ftp.example.com</text>
  <rect x="345" y="115" width="130" height="18" rx="4" fill="#e0f2f1"/>
  <text x="408" y="128" text-anchor="middle" fill="#00695c" font-size="9">📁 /public/</text>
  <rect x="345" y="138" width="130" height="18" rx="4" fill="#e0f2f1"/>
  <text x="408" y="151" text-anchor="middle" fill="#00695c" font-size="9">📁 /private/</text>
  <!-- Comparison box -->
  <rect x="510" y="55" width="170" height="120" rx="8" fill="white" stroke="#546e7a" stroke-width="1.5"/>
  <text x="595" y="75" text-anchor="middle" fill="#0a2342" font-size="11" font-weight="bold">Security</text>
  <rect x="522" y="82" width="146" height="22" rx="4" fill="#ffebee"/>
  <text x="595" y="97" text-anchor="middle" fill="#e53935" font-size="10">FTP — Unencrypted ⚠️</text>
  <rect x="522" y="108" width="146" height="22" rx="4" fill="#e8f5e9"/>
  <text x="595" y="123" text-anchor="middle" fill="#2e7d32" font-size="10">FTPS — SSL/TLS 🔒</text>
  <rect x="522" y="134" width="146" height="22" rx="4" fill="#e8f5e9"/>
  <text x="595" y="149" text-anchor="middle" fill="#2e7d32" font-size="10">SFTP — SSH 🔐</text>
  <text x="350" y="200" text-anchor="middle" fill="#0a2342" font-size="12" font-weight="bold">FTP — File Transfer Protocol Client-Server Model</text>
</svg>
